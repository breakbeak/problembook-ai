services:
  - type: web
    name: problembook-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: PYTHON_VERSION
        value: 3.13.5
